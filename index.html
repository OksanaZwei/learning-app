<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recall">
<meta name="robots" content="noindex,nofollow">
<title>Recall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs" aria-label="Navigation">
    <button data-a="tab" data-t="home" aria-label="Start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Start</span>
    </button>
    <button data-a="tab" data-t="words" aria-label="Wörter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
      <i class="tb" hidden></i>
      <span>Wörter</span>
    </button>
    <button data-a="tab" data-t="practice" aria-label="Üben">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg>
      <span>Üben</span>
    </button>
    <button data-a="tab" data-t="import" aria-label="Import">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span>Import</span>
    </button>
    <button data-a="tab" data-t="more" aria-label="Mehr">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      <span>Mehr</span>
    </button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="starter.js"></script>
<script src="app.js"></script>
</body>
</html>
