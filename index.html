<!doctype html>
<html lang="de">

      <span>Themen</span>
    </button>
    <button data-a="tab" data-t="words" aria-label="Wörter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg><i class="tb" hidden></i>

      <span>Optionen</span>
    </button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="core.js"></script>
